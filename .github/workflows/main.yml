name: Full Stack Public RDP (ngrok) + Ollama + AnythingLLM

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      USERNAME: runner
      PASSWORD: runner
      OLLAMA_MODEL: llama3.2:1b
      ANYTHINGLLM_PORT: 3001
      STORAGE_DIR: /home/runner/anythingllm_data

    steps:
      - uses: actions/checkout@v4

      # ------------------- XFCE + xrdp -------------------
      - name: Install XFCE and xrdp
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xfce4 xfce4-goodies xorg dbus-x11 xrdp
          echo "startxfce4" | sudo tee /home/${USERNAME}/.xsession
          sudo chown ${USERNAME}:${USERNAME} /home/${USERNAME}/.xsession
          sudo systemctl enable --now xrdp
          sudo systemctl restart xrdp

      - name: Set user password and sudo
        run: |
          echo "${USERNAME}:${PASSWORD}" | sudo chpasswd
          echo "${USERNAME} ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/${USERNAME}

      # ------------------- Docker -------------------
      - name: Install Docker
        run: |
          curl -fsSL https://get.docker.com | sudo sh
          sudo usermod -aG docker ${USERNAME}
          sudo systemctl start docker

      # ------------------- Ollama (native) -------------------
      - name: Install Ollama and pull model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama
          sudo mkdir -p /etc/systemd/system/ollama.service.d
          echo -e "[Service]\nEnvironment=OLLAMA_HOST=0.0.0.0:11434" | sudo tee /etc/systemd/system/ollama.service.d/override.conf
          sudo systemctl daemon-reload
          sudo systemctl start ollama
          sudo systemctl enable ollama
          sleep 5
          ollama pull ${OLLAMA_MODEL}
          ollama list

      # ------------------- AnythingLLM (Docker) -------------------
      - name: Deploy AnythingLLM
        run: |
          sudo mkdir -p ${STORAGE_DIR}
          sudo chown -R 1000:1000 ${STORAGE_DIR}
          sudo chmod -R 755 ${STORAGE_DIR}
          docker rm -f anythingllm 2>/dev/null || true
          docker run -d \
            --name anythingllm \
            -p ${ANYTHINGLLM_PORT}:3001 \
            -e STORAGE_DIR="/app/server/storage" \
            -v ${STORAGE_DIR}:/app/server/storage \
            --add-host host.docker.internal:host-gateway \
            --restart=unless-stopped \
            mintplexlabs/anythingllm
          # Wait for HTTP service
          for i in {1..30}; do
            if curl -s -f -o /dev/null http://localhost:${ANYTHINGLLM_PORT}; then
              echo "AnythingLLM is ready"
              break
            fi
            sleep 3
          done

      # ------------------- ngrok (Public RDP Tunnel) -------------------
      - name: Expose RDP publicly via ngrok
        run: |
          wget -q https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz
          tar xzf ngrok-v3-stable-linux-amd64.tgz
          ./ngrok config add-authtoken ${{ secrets.NGROK_AUTHTOKEN }}
          ./ngrok tcp 3389 --log=stdout > ngrok-rdp.log 2>&1 &
          sleep 5
          PUBLIC_RDP=$(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url' | sed 's/tcp:\/\///')
          echo "PUBLIC_RDP=$PUBLIC_RDP" >> $GITHUB_ENV

      # ------------------- ngrok (AnythingLLM Custom Domain) -------------------
      - name: Expose AnythingLLM with custom domain
        run: |
          docker rm -f ngrok-anything 2>/dev/null || true
          docker run -d \
            --name ngrok-anything \
            --net=host \
            -e NGROK_AUTHTOKEN=${{ secrets.NGROK_AUTHTOKEN }} \
            ngrok/ngrok:latest \
            http --url=jigsaw-stiffness-cryptic.ngrok-free.dev ${ANYTHINGLLM_PORT}
          sleep 5
          echo "AnythingLLM Public URL: https://jigsaw-stiffness-cryptic.ngrok-free.dev"

      # ------------------- Connection Information -------------------
      - name: Show Connection Details
        run: |
          echo "============================================================"
          echo "                FULL STACK PUBLIC RDP READY                "
          echo "============================================================"
          echo "🖥️  Public RDP Address:"
          echo "    ${PUBLIC_RDP}"
          echo "    Username : ${USERNAME}"
          echo "    Password : ${PASSWORD}"
          echo ""
          echo "🌐 AnythingLLM Public URL:"
          echo "    https://jigsaw-stiffness-cryptic.ngrok-free.dev"
          echo ""
          echo "💻 Inside RDP desktop එකේ Firefox open කරන්න:"
          echo "    http://localhost:${ANYTHINGLLM_PORT}"
          echo ""
          echo "🤖 AnythingLLM Settings > LLM Provider:"
          echo "    Provider : Ollama"
          echo "    Base URL : http://host.docker.internal:11434"
          echo "    Model    : ${OLLAMA_MODEL}"
          echo ""
          echo "⏳ Workflow එක cancel කරනකම් run වේ (max 6h)."
          echo "============================================================"

      # ------------------- Keep Alive -------------------
      - name: Keep Runner Alive
        run: sleep 6h
