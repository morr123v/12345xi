name: Full Stack - XFCE RDP + Tailscale + Ollama + AnythingLLM (Ollama Reachable)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}   # ← make sure this secret exists
      USERNAME: runner
      PASSWORD: runner
      TAILSCALE_HOSTNAME: full-stack-${{ github.run_id }}
      OLLAMA_MODEL: llama3.2:1b
      ANYTHINGLLM_PORT: 3001
      STORAGE_DIR: /home/runner/anythingllm_data

    steps:
      - uses: actions/checkout@v4

      # ---------- RDP (XFCE) ----------
      - name: Install XFCE and xrdp
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xfce4 xfce4-goodies xorg dbus-x11 xrdp
          echo "startxfce4" | sudo tee /home/${USERNAME}/.xsession
          sudo chown ${USERNAME}:${USERNAME} /home/${USERNAME}/.xsession
          sudo systemctl enable --now xrdp
          sudo systemctl restart xrdp

      - name: Set user password and sudo
        run: |
          echo "${USERNAME}:${PASSWORD}" | sudo chpasswd
          echo "${USERNAME} ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/${USERNAME}

      # ---------- Tailscale ----------
      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sudo sh
          sudo tailscale up --authkey "${TAILSCALE_AUTHKEY}" --hostname "${TAILSCALE_HOSTNAME}"

      # ---------- Docker ----------
      - name: Install Docker
        run: |
          curl -fsSL https://get.docker.com | sudo sh
          sudo usermod -aG docker ${USERNAME}
          sudo systemctl start docker

      # ---------- Ollama (native) - listen on all interfaces ----------
      - name: Install and configure Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama
          sudo mkdir -p /etc/systemd/system/ollama.service.d
          echo -e "[Service]\nEnvironment=OLLAMA_HOST=0.0.0.0:11434" | sudo tee /etc/systemd/system/ollama.service.d/override.conf
          sudo systemctl daemon-reload
          sudo systemctl start ollama
          sudo systemctl enable ollama
          sleep 5
          sudo netstat -tulpn | grep 11434 || true
          ollama pull ${OLLAMA_MODEL}
          ollama list

      # ---------- AnythingLLM (Docker) ----------
      - name: Deploy AnythingLLM
        run: |
          sudo mkdir -p ${STORAGE_DIR}
          sudo chown -R 1000:1000 ${STORAGE_DIR}
          sudo chmod -R 755 ${STORAGE_DIR}
          docker rm -f anythingllm 2>/dev/null || true
          docker run -d \
            --name anythingllm \
            -p ${ANYTHINGLLM_PORT}:3001 \
            -e STORAGE_DIR="/app/server/storage" \
            -v ${STORAGE_DIR}:/app/server/storage \
            --add-host host.docker.internal:host-gateway \
            --restart=unless-stopped \
            mintplexlabs/anythingllm

          echo "Waiting for AnythingLLM..."
          for i in {1..30}; do
            if curl -s -f -o /dev/null --max-time 5 http://localhost:${ANYTHINGLLM_PORT}; then
              echo "✓ AnythingLLM ready"
              break
            fi
            sleep 3
            if [ $i -eq 30 ]; then
              echo "❌ ERROR: AnythingLLM failed to start"
              docker logs anythingllm
              exit 1
            fi
          done

      # ---------- ngrok (public RDP) ----------
      - name: Expose RDP with ngrok
        run: |
          # 1. Download & extract ngrok
          wget -q https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz
          tar xzf ngrok-v3-stable-linux-amd64.tgz
          
          # 2. Check the authtoken (the missing token caused your error)
          if [ -z "${NGROK_AUTH_TOKEN}" ]; then
            echo "❌ ERROR: NGROK_AUTH_TOKEN secret is empty!"
            echo "   Add it under Settings → Secrets → Actions"
            exit 1
          fi
          
          # 3. Authenticate and start TCP tunnel for RDP port 3389
          ./ngrok config add-authtoken "${NGROK_AUTH_TOKEN}"
          ./ngrok tcp 3389 --log=stdout &
          
          # 4. Wait for ngrok to be ready and fetch public URL
          sleep 5
          NGROK_URL=$(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url')
          echo "============================================================"
          echo "        PUBLIC RDP ADDRESS (via ngrok)"
          echo "  ${NGROK_URL}"
          echo "  (replace tcp:// with nothing and use port after colon)"
          echo "============================================================"

      # ---------- Connection Information ----------
      - name: Print all connection details
        run: |
          TS_IP=$(sudo tailscale ip -4 | head -n1 | tr -d ' ')
          echo "============================================================"
          echo "                FULL STACK IS READY                         "
          echo "============================================================"
          echo "TAILSCALE (private):"
          echo "  RDP:   ${TS_IP}:3389  | user: ${USERNAME}  pass: ${PASSWORD}"
          echo "  AnythingLLM: http://${TS_IP}:${ANYTHINGLLM_PORT}"
          echo "  Ollama API:  http://${TS_IP}:11434  (model: ${OLLAMA_MODEL})"
          echo ""
          echo "ANYTHINGLLM -> OLLAMA SETTINGS:"
          echo "  Base URL: http://host.docker.internal:11434"
          echo "  Model:    ${OLLAMA_MODEL}"
          echo ""
          echo "NGROK public RDP URL is printed in the step above."
          echo "============================================================"

      # ---------- Keep Alive ----------
      - name: Keep Runner Alive
        run: while true; do sleep 600; done
